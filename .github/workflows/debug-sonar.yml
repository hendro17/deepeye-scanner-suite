name: Debug Sonar Issues
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch Sonar Issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "Host: $SONAR_HOST_URL"
          # Get project issues for PR 4
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/issues/search?componentKeys=hendro17_deepeye-scanner-suite_214947e1-6b5f-4b67-b3d0-bc501a4a9d0a&pullRequest=4&ps=100&resolved=false" | python3 -m json.tool | head -n 500
          echo "---QUALITY GATE---"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=hendro17_deepeye-scanner-suite_214947e1-6b5f-4b67-b3d0-bc501a4a9d0a&pullRequest=4" | python3 -m json.tool | head -n 200
