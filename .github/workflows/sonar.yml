name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install backend deps
        run: |
          if [ ! -d api ]; then
            echo "api/ not yet created — skipping backend install"
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          if [ -f api/requirements-dev.txt ]; then pip install -r api/requirements-dev.txt; fi

      - name: Run pytest with coverage
        run: |
          if [ ! -d api ]; then
            echo "api/ not yet created — skipping backend tests"
            mkdir -p api && touch api/coverage.xml
            exit 0
          fi
          cd api
          pytest --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: Install frontend deps
        if: always()
        run: |
          if [ ! -d web ] || [ ! -f web/package.json ]; then
            echo "web/ not yet created — skipping frontend install"
            exit 0
          fi
          cd web
          pnpm install --frozen-lockfile || pnpm install

      - name: Run vitest with coverage
        if: always()
        run: |
          if [ ! -d web ] || [ ! -f web/package.json ]; then
            echo "web/ not yet created — skipping frontend tests"
            mkdir -p web/coverage && touch web/coverage/lcov.info
            exit 0
          fi
          cd web
          pnpm exec vitest run --coverage

      - name: Verify coverage reports exist
        if: always()
        run: |
          echo "Checking coverage reports..."
          ls -lh api/coverage.xml 2>&1 || echo "::warning::api/coverage.xml missing — Sonar coverage will be 0%"
          ls -lh web/coverage/lcov.info 2>&1 || echo "::warning::web/coverage/lcov.info missing — Sonar coverage will be 0%"
          # Fail fast if both are missing/empty to surface misconfiguration
          if [ ! -s api/coverage.xml ] && [ ! -s web/coverage/lcov.info ]; then
            echo "::error::No coverage reports found — Quality Gate will fail on coverage"
          fi

      - name: SonarQube Scan
        if: always()
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Dump Sonar issues (debug)
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          echo "=== Sonar issues for PR ${{ github.event.pull_request.number || 'N/A' }} ==="
          PR="${{ github.event.pull_request.number }}"
          if [ -z "$PR" ]; then
            echo "No PR number, skipping dump"
            exit 0
          fi
          # Give server time to process
          sleep 5
          echo "--- Issues search ---"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/issues/search?componentKeys=hendro17_deepeye-scanner-suite_214947e1-6b5f-4b67-b3d0-bc501a4a9d0a&pullRequest=$PR&ps=100&resolved=false" | python3 -c "import json,sys; d=json.load(sys.stdin); print(f\"total={d.get('total')}\"); [print(f\"{i['rule']} {i['severity']} {i['component'].split('/')[-1]}:{i.get('line','?')} {i['message'][:120]}\") for i in d.get('issues',[])]" | head -n 120 || echo "failed to parse issues"
          echo "--- Quality gate status ---"
          curl -s -u "$SONAR_TOKEN:" "$SONAR_HOST_URL/api/qualitygates/project_status?projectKey=hendro17_deepeye-scanner-suite_214947e1-6b5f-4b67-b3d0-bc501a4a9d0a&pullRequest=$PR" | python3 -m json.tool | head -n 100 || echo "failed QG"

      # Fail job when Quality Gate is red — per Sonar docs:
      # https://docs.sonarsource.com/sonarqube-server/latest/analyzing-source-code/ci-integration/overview/#fail-job-when-quality-gate-is-red
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # We do not recommend to use this in a pull request. Prefer using pull request
      # decoration instead.
      - uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        if: always()
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
