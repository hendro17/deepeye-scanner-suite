name: SonarQube Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Install backend deps
        run: |
          if [ ! -d api ]; then
            echo "api/ not yet created — skipping backend install"
            exit 0
          fi
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          if [ -f api/requirements-dev.txt ]; then pip install -r api/requirements-dev.txt; fi

      - name: Run pytest with coverage
        continue-on-error: true
        run: |
          if [ ! -d api ]; then
            echo "api/ not yet created — skipping backend tests"
            mkdir -p api && touch api/coverage.xml
            exit 0
          fi
          cd api
          pytest --cov --cov-report=xml:coverage.xml --cov-report=term

      - name: Install frontend deps
        run: |
          if [ ! -d web ] || [ ! -f web/package.json ]; then
            echo "web/ not yet created — skipping frontend install"
            exit 0
          fi
          cd web
          pnpm install --frozen-lockfile || pnpm install

      - name: Run vitest with coverage
        continue-on-error: true
        run: |
          if [ ! -d web ] || [ ! -f web/package.json ]; then
            echo "web/ not yet created — skipping frontend tests"
            mkdir -p web/coverage && touch web/coverage/lcov.info
            exit 0
          fi
          cd web
          pnpm exec vitest run --coverage

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}
