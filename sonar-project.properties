sonar.projectKey=hendro17_deepeye-scanner-suite_214947e1-6b5f-4b67-b3d0-bc501a4a9d0a
sonar.projectName=DeepEye Scanner Suite
sonar.sourceEncoding=UTF-8

# Source directories
sonar.sources=api,web/src

# Exclude deep-eye submodule (external, not our code)
# Also exclude common non-analyzable artifacts
sonar.exclusions=scanner/deep-eye/**,**/__pycache__/**,**/*.pyc,**/.venv/**,**/node_modules/**,**/dist/**,**/*.min.js,**/*.min.css

# Python configuration
sonar.python.version=3.12
sonar.python.coverage.reportPaths=api/coverage.xml

# JavaScript/TypeScript coverage (lcov format)
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info
sonar.typescript.lcov.reportPaths=web/coverage/lcov.info

# Test directories and patterns
sonar.tests=api/tests,web/src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.tsx,**/*.spec.tsx,**/test_*.py,**/*_test.py

# Exclude tests, migrations, configs, and static doc views from coverage calculation
sonar.coverage.exclusions=scanner/deep-eye/**,**/tests/**,**/test/**,**/node_modules/**,**/dist/**,**/migrations/**,**/conftest.py,**/*.test.ts,**/*.spec.ts,web/src/views/Docs.vue

# Required for SonarCloud — uncomment and set your org key
# For self-hosted SonarQube, leave this commented
# sonar.organization=your-sonarcloud-org
